<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الساعة الرقمية</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .clock-card {
            background-color: #1e293b;
            padding: 40px 60px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
            border: 1px solid #334155;
        }

        .clock-title {
            font-size: 1.5rem;
            color: #94a3b8;
            margin-bottom: 20px;
        }

        #clock {
            font-size: 4rem;
            font-weight: bold;
            color: #38bdf8;
            letter-spacing: 2px;
            font-family: monospace;
        }

        #date {
            font-size: 1.2rem;
            color: #cbd5e1;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="clock-card">
        <div class="clock-title">الساعة الآن</div>
        <div id="clock">00:00:00</div>
        <div id="date">--/--/----</div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();

            // جلب الساعات والدقائق والثواني
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();

            // إضافة صفر على اليسار إذا كان الرقم أقل من 10
            hours = hours < 10 ? '0' + hours : hours;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;

            // تنسيق الوقت
            const timeString = `${hours}:${minutes}:${seconds}`;
            document.getElementById('clock').textContent = timeString;

            // تنسيق التاريخ
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const dateString = now.toLocaleDateString('ar-EG', options);
            document.getElementById('date').textContent = dateString;
        }

        // تحديث الساعة فوراً ثم كل ثانية
        updateClock();
        setInterval(updateClock, 1000);
    </script>

</body>
</html>
